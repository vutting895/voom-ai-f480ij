name: VOOM AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build

  python-agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed Python dependency pins
        working-directory: services/agent-python
        run: |
          python -m pip install pip-tools==7.7.0
          pip-compile --resolver=backtracking --output-file=/tmp/requirements.generated.lock requirements.txt
          python - <<'PY'
          import re
          from pathlib import Path

          def package_pins(path):
              pins = []
              for line in Path(path).read_text().splitlines():
                  if not line or line.startswith("#") or line.startswith(" "):
                      continue
                  match = re.match(r"^([A-Za-z0-9_.-]+(?:\[[^]]+\])?==[^\s;]+)", line)
                  if match:
                      pins.append(match.group(1).lower())
              return sorted(pins)

          committed = package_pins("requirements.lock")
          generated = package_pins("/tmp/requirements.generated.lock")
          if committed != generated:
              print("Committed dependency pins are stale.")
              print("Missing or changed:", sorted(set(generated) - set(committed)))
              print("Unexpected:", sorted(set(committed) - set(generated)))
              raise SystemExit(1)
          PY
      - name: Install pinned Python service dependencies
        working-directory: services/agent-python
        run: python -m pip install -r requirements.lock
      - name: Compile Python service
        run: python -m compileall -q services/agent-python/app
      - name: Run Python service tests
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token-ci-test-token-ci-test-token-123456
        run: python -m unittest discover -s tests -v
      - name: Import application
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token-ci-test-token-ci-test-token-123456
        run: python -c "from app.main import app; assert app"
      - name: Audit resolved Python dependencies
        working-directory: services/agent-python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock
      - name: Capture resolved dependency inventory and CycloneDX SBOM
        working-directory: services/agent-python
        run: |
          python -m pip freeze > python-dependencies-resolved.txt
          python -m pip install cyclonedx-bom==9.0.0
          cyclonedx-py environment --output-format JSON --output-file agent-python-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-python-dependency-evidence
          path: |
            services/agent-python/requirements.lock
            services/agent-python/python-dependencies-resolved.txt
            services/agent-python/agent-python-sbom.json
          if-no-files-found: error
