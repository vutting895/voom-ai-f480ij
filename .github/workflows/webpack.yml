name: VOOM AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build

  python-agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python service dependencies
        working-directory: services/agent-python
        run: python -m pip install -r requirements.txt
      - name: Compile Python service
        run: python -m compileall -q services/agent-python/app
      - name: Run Python service tests
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token-ci-test-token-ci-test-token-123456
        run: python -m unittest discover -s tests -v
      - name: Import application
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token-ci-test-token-ci-test-token-123456
        run: python -c "from app.main import app; assert app"
      - name: Audit resolved Python dependencies
        working-directory: services/agent-python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Capture resolved dependency inventory and CycloneDX SBOM
        working-directory: services/agent-python
        run: |
          python -m pip freeze > python-dependencies-resolved.txt
          python -m pip install cyclonedx-bom==9.0.0
          cyclonedx-py environment --output-format JSON --output-file agent-python-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-python-dependency-evidence
          path: |
            services/agent-python/python-dependencies-resolved.txt
            services/agent-python/agent-python-sbom.json
          if-no-files-found: error
