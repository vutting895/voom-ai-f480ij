name: VOOM AI CI

on:
  push:
    branches: [main, feature/hybrid-ai-runtime-ollama-agents]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build

  python-agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python service dependencies
        working-directory: services/agent-python
        run: python -m pip install -r requirements.txt
      - name: Compile Python service
        run: python -m compileall -q services/agent-python/app
      - name: Run authentication unit tests
        working-directory: services/agent-python
        run: python -m unittest discover -s tests -v
      - name: Import application
        working-directory: services/agent-python
        env:
          VOOM_AGENT_API_TOKEN: ci-test-token
        run: python -c "from app.main import app; assert app"
