name: VOOM AI Runtime Security CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "sever.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/webpack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voom-runtime-security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
