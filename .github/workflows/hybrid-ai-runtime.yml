name: Hybrid AI Runtime Tests

on:
  push:
    branches: [feature/hybrid-ai-runtime-ollama-agents]
  pull_request:
    branches: [main]
    paths:
      - "src/ai/**"
      - "services/agent-python/**"
      - "test/ai/**"
      - "package.json"
      - ".github/workflows/hybrid-ai-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test

  python-agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q services/agent-python/app
